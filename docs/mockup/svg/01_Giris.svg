<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" xmlns:c2pa="http://c2pa.org/manifest"><title>01 Giriş</title><g id="Sol panel">
<rect x="0" y="0" width="640" height="900" rx="0" fill="#0F172A"/>
<g id="Logo">
<rect x="64" y="58" width="36" height="36" rx="8" fill="#2563EB"/>
<polyline points="73.0,84.0 79.0,77.0 84.0,81.0 91.0,73.0" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<polyline points="86.0,73.0 91.0,73.0 91.0,78.0" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text x="112" y="71" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Darboğaz</text>
<text x="112" y="91" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#CBD5E1">İzleme Portalı</text>
</g>
<g id="Slogan">
<text x="64" y="257" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">Makine durmadan</text>
<text x="64" y="300" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">yavaşladığında</text>
<text x="64" y="343" font-family="Inter, Arial, sans-serif" font-size="36" font-weight="700" fill="#fff">ilk siz bilin.</text>
<text x="64" y="387" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">Üretim hattındaki sinsi yavaşlamayı, yanlış alarmı ve gerçek arızayı</text>
<text x="64" y="412" font-family="Inter, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8">birbirinden ayıran erken uyarı ve karar destek portalı.</text>
</g>
<g id="Özellik / Doğrulanmış veri">
<rect x="64" y="442" width="34" height="34" rx="6" fill="#1E293B"/>
<text x="81" y="464" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="middle">1</text>
<text x="112" y="458" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Doğrulanmış veri</text>
<text x="112" y="480" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Ağ gecikmesi ve sensör hatası arıza sayılmaz.</text>
</g>
<g id="Özellik / Erken uyarı">
<rect x="64" y="506" width="34" height="34" rx="6" fill="#1E293B"/>
<text x="81" y="528" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="middle">2</text>
<text x="112" y="522" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Erken uyarı</text>
<text x="112" y="544" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Kritik eşiğe kalan süre önceden hesaplanır.</text>
</g>
<g id="Özellik / Karar desteği">
<rect x="64" y="570" width="34" height="34" rx="6" fill="#1E293B"/>
<text x="81" y="592" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#60A5FA" text-anchor="middle">3</text>
<text x="112" y="586" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff">Karar desteği</text>
<text x="112" y="608" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#94A3B8">Kayıp TL'ye, gecikme siparişe bağlanır.</text>
</g>
<g id="İstatistik / İzlenen makine">
<rect x="64" y="780" width="164" height="64" rx="8" fill="#1E293B"/>
<text x="78" y="804" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#CBD5E1">İzlenen makine</text>
<text x="78" y="828" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">7</text>
</g>
<g id="İstatistik / Hat">
<rect x="238" y="780" width="164" height="64" rx="8" fill="#1E293B"/>
<text x="252" y="804" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#CBD5E1">Hat</text>
<text x="252" y="828" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">2</text>
</g>
<g id="İstatistik / Ölçüm aralığı">
<rect x="412" y="780" width="164" height="64" rx="8" fill="#1E293B"/>
<text x="426" y="804" font-family="Inter, Arial, sans-serif" font-size="12" font-weight="400" fill="#CBD5E1">Ölçüm aralığı</text>
<text x="426" y="828" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="700" fill="#fff">2 sn</text>
</g>
</g>
<g id="Sağ panel">
<rect x="640" y="0" width="800" height="900" rx="0" fill="#F1F5F9"/>
