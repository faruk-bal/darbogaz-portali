<rect x="830" y="351" width="420" height="44" rx="8" fill="#fff" stroke="#CBD5E1" stroke-width="1"/>
<text x="843" y="378.0" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A">faruk.b@fabrika.com.tr</text>
</g>
<text x="830" y="419" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B">Şifre</text>
