<text x="854" y="500" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#0F172A">Beni hatırla</text>
</g>
<g id="Buton / Giriş yap">
<rect x="830" y="525" width="420" height="46" rx="8" fill="#2563EB"/>
