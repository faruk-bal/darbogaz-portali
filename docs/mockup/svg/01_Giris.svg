<text x="830" y="273" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#0F172A">Giriş yap</text>
<text x="830" y="299" font-family="Inter, Arial, sans-serif" font-size="14" font-weight="400" fill="#64748B">Kurumsal e-posta adresinizle oturum açın.</text>
<text x="830" y="343" font-family="Inter, Arial, sans-serif" font-size="13" font-weight="400" fill="#64748B">E-posta</text>
